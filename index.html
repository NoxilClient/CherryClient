<!DOCTYPE html>
<html lang="it" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Client</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkbg: '#0a0a0c',
                        cardbg: '#141418',
                        oceanblue: '#3b82f6',
                        oceanhover: '#2563eb'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a0a0c;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="w-full px-6 py-6 flex items-center justify-between max-w-7xl mx-auto">
        <!-- Logo + Nome -->
        <a href="#" class="flex items-center gap-3 group">
            <div class="w-9 h-9 rounded-xl bg-[#141418] border border-white/10 flex items-center justify-center p-1 group-hover:border-blue-500/50 transition">
                <svg viewBox="0 0 512 512" class="w-full h-full fill-white">
                    <path d="M140 372c-2.7 0-5.3-1-7.3-3-4.1-4.1-4.1-10.7 0-14.8l74.3-74.3c4.1-4.1 10.7-4.1 14.8 0s4.1 10.7 0 14.8l-74.3 74.3c-2 2-4.6 3-7.5 3z"/>
                    <path d="M372 320c-13.8 0-26.6-4.5-37-12.2-25.7 18.2-57.8 29.2-93 29.2-88.4 0-160-71.6-160-160 0-35.2 11-67.3 29.2-93-7.7 10.4-12.2 23.2-12.2 37 0 35.3 28.7 64 64 64s64-28.7 64-64-28.7-64-64-64c-13.8 0-26.6 4.5-37 12.2C175.7 58 207.8 47 243 47c88.4 0 160 71.6 160 160 0 35.2-11 67.3-29.2 93 7.7-10.4 12.2-23.2 12.2-37 0-35.3-28.7-64-64-64s-64 28.7-64 64 28.7 64 64 64c13.8 0 26.6-4.5 37-12.2 10.4 7.7 23.2 12.2 37 12.2 35.3 0 64-28.7 64-64s-28.7-64-64-64z"/>
                    <path d="M368 372c-2.7 0-5.3-1-7.3-3-4.1-4.1-4.1-10.7 0-14.8l21.3-21.3c4.1-4.1 10.7-4.1 14.8 0s4.1 10.7 0 14.8l-21.3 21.3c-2 2-4.6 3-7.5 3z"/>
                </svg>
            </div>
            <span class="font-bold text-lg tracking-tight text-white">Ocean</span>
        </a>

        <!-- Menu centrale -->
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-zinc-400">
            <a href="#" class="hover:text-white transition">Store</a>
            <a href="#" class="hover:text-white transition">News</a>
            <a href="#" class="hover:text-white transition">Download</a>
            <a href="#" class="hover:text-white transition flex items-center gap-1.5"><i class="fa-brands fa-discord"></i> Discord</a>
        </nav>

        <!-- Pulsanti Destra -->
        <div class="flex items-center gap-3">
            <button class="px-4 py-2 rounded-full bg-zinc-900 border border-zinc-800 text-xs font-semibold text-zinc-300 hover:bg-zinc-800 transition shadow-sm">
                Get Oceans <i class="fa-solid fa-circle-question ml-1 text-zinc-500"></i>
            </button>
            <button class="px-5 py-2 rounded-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition shadow-lg shadow-blue-600/20">
                Sign in
            </button>
        </div>
    </header>

    <!-- Main Hero Section (Stile pulito e centrato come nell'immagine) -->
    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 -mt-12">
        
        <!-- Logo Centrale in stile icona grande -->
        <div class="w-24 h-24 mb-8 rounded-3xl bg-[#141418] border border-white/10 flex items-center justify-center p-4 shadow-2xl shadow-blue-500/10">
            <svg viewBox="0 0 512 512" class="w-full h-full fill-white">
                <path d="M140 372c-2.7 0-5.3-1-7.3-3-4.1-4.1-4.1-10.7 0-14.8l74.3-74.3c4.1-4.1 10.7-4.1 14.8 0s4.1 10.7 0 14.8l-74.3 74.3c-2 2-4.6 3-7.5 3z"/>
                <path d="M372 320c-13.8 0-26.6-4.5-37-12.2-25.7 18.2-57.8 29.2-93 29.2-88.4 0-160-71.6-160-160 0-35.2 11-67.3 29.2-93-7.7 10.4-12.2 23.2-12.2 37 0 35.3 28.7 64 64 64s64-28.7 64-64-28.7-64-64-64c-13.8 0-26.6 4.5-37 12.2C175.7 58 207.8 47 243 47c88.4 0 160 71.6 160 160 0 35.2-11 67.3-29.2 93 7.7-10.4 12.2-23.2 12.2-37 0-35.3-28.7-64-64-64s-64 28.7-64 64 28.7 64 64 64c13.8 0 26.6-4.5 37-12.2 10.4 7.7 23.2 12.2 37 12.2 35.3 0 64-28.7 64-64s-28.7-64-64-64z"/>
                <path d="M368 372c-2.7 0-5.3-1-7.3-3-4.1-4.1-4.1-10.7 0-14.8l21.3-21.3c4.1-4.1 10.7-4.1 14.8 0s4.1 10.7 0 14.8l-21.3 21.3c-2 2-4.6 3-7.5 3z"/>
            </svg>
        </div>

        <!-- Titolo Principale -->
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-2 text-white">
            Play <span class="text-blue-500">better.</span>
        </h1>
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-10 text-white">
            Play Ocean.
        </h1>

        <!-- Pulsanti d'azione -->
        <div class="flex flex-col sm:flex-row items-center gap-4 w-full justify-center max-w-md">
            <a href="#" class="w-full sm:w-auto px-8 py-3.5 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-semibold transition shadow-lg shadow-blue-600/25 text-center">
                Download Ocean
            </a>
            <a href="#" class="w-full sm:w-auto px-8 py-3.5 rounded-full bg-[#141418] hover:bg-zinc-800 text-zinc-300 border border-white/10 font-semibold transition text-center">
                See modules
            </a>
        </div>

    </main>

    <!-- Footer Informativo inferiore -->
    <footer class="w-full py-6 text-center text-xs text-zinc-500 font-medium tracking-wide">
        Free • Minecraft Client • Windows
    </footer>

</body>
</html>
